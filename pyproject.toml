[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meningeal-extension"
version = "0.1.0"
description = "Extension analysis: stratification of five Heidelberg-screened antimeningioma compounds by two independent molecular classification systems."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Computational Biology Team", email = "research@example.com"}
]
keywords = [
    "meningioma",
    "drug-repurposing",
    "HDAC",
    "proteasome",
    "NF2",
    "ssGSEA",
    "molecular-classification"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.22",
    "GEOparse>=2.0.3",
    "mygene>=3.2.2",
    "biopython>=1.83",
    "requests>=2.32",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "lifelines>=0.28",
    "adjustText>=0.8",
    "patsy>=0.5"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "jupyter>=1.0",
    "ipywidgets>=8.1"
]

[project.scripts]
aim0-cohort-lock = "meningeal_extension.cli:aim0_main"
aim1-concordance = "meningeal_extension.cli:aim1_main"
aim2-target-assoc = "meningeal_extension.cli:aim2_main"
aim3-replication = "meningeal_extension.cli:aim3_main"
aim4-survival = "meningeal_extension.cli:aim4_main"
run-all = "meningeal_extension.cli:run_all"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501", "W503"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
